name: Build NEW Under Metro

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download current repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract ONLY new archive
        shell: bash
        run: |
          test -f undermetro-new.zip
          sha256sum undermetro-new.zip
          unzip -q undermetro-new.zip -d fresh-source

      - name: Find project and rebuild
        shell: bash
        run: |
          mapfile -t wrappers < <(find fresh-source -type f -name gradlew)
          if [ "${#wrappers[@]}" -ne 1 ]; then
            echo "Expected exactly one Gradle project, found: ${#wrappers[@]}"
            printf '%s\n' "${wrappers[@]}"
            exit 1
          fi
          cd "$(dirname "${wrappers[0]}")"
          echo "Building project from: $PWD"
          bash ./gradlew clean build \
            --no-daemon \
            --no-build-cache \
            --no-configuration-cache \
            --rerun-tasks \
            --stacktrace

      - name: Upload NEW mod
        uses: actions/upload-artifact@v4
        with:
          name: NEW-undermetro-${{ github.run_number }}
          path: fresh-source/**/build/libs/*.jar
          if-no-files-found: error
