name: Build Under Metro

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract source archive
        run: unzip -q undermetro-src.zip -d mod-source

      - name: Build mod
        shell: bash
        run: |
          wrapper=$(find mod-source -type f -name gradlew -print -quit)
          if [ -z "$wrapper" ]; then
            echo "No gradlew found inside undermetro-src.zip"
            exit 1
          fi
          cd "$(dirname "$wrapper")"
          bash ./gradlew build --no-daemon --stacktrace

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: undermetro-mod
          path: mod-source/**/build/libs/*.jar
          if-no-files-found: error
